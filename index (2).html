<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --grad-top: #b9a8ec;
  --grad-bottom: #9fd3f2;
  --white: #ffffff;
  --text: #3d3a52;
  --text-soft: #6e6a85;
  --card: rgba(255,255,255,0.92);
  --line: rgba(122,100,200,0.18);
  --accent: #7a64c8;
  --type-color: #7a64c8;
}

body {
  font-family: 'Zen Maru Gothic', sans-serif;
  color: var(--text);
  background: var(--grad-bottom);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* 小さな星の装飾 */
.stars {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,0.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 28% 42%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(2px 2px at 72% 12%, rgba(255,255,255,0.9) 0%, transparent 100%),
    radial-gradient(1px 1px at 86% 34%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 55% 26%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 8% 68%, rgba(255,255,255,0.7) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 92% 72%, rgba(255,255,255,0.8) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 88%, rgba(255,255,255,0.7) 0%, transparent 100%),
    linear-gradient(180deg, var(--grad-top) 0%, var(--grad-bottom) 100%);
}

.page {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 16px 48px;
}

/* ===== 入力ページ ===== */
.brand {
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: rgba(255,255,255,0.9);
  margin-bottom: 20px;
}
.hero-title {
  text-align: center;
  font-size: clamp(28px, 8vw, 36px);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--white);
  text-shadow: 0 2px 12px rgba(90,70,170,0.25);
  margin-bottom: 14px;
}
.hero-catch {
  text-align: center;
  font-size: 17px;
  font-weight: 500;
  color: var(--white);
  letter-spacing: 0.1em;
  margin-bottom: 14px;
}
.hero-sub {
  text-align: center;
  font-size: 13px;
  line-height: 2;
  color: rgba(255,255,255,0.92);
  margin-bottom: 32px;
}

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 28px 20px;
  box-shadow: 0 8px 28px rgba(90,70,170,0.15);
  margin-bottom: 16px;
}

.field-label {
  display: block;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.2em;
  margin-bottom: 14px;
}
.date-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 8px;
}
select {
  width: 100%;
  font-family: inherit;
  font-size: 16px;
  color: var(--text);
  background: #f6f3ff;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 12px 8px;
  appearance: none;
  -webkit-appearance: none;
  text-align: center;
  outline: none;
}
select:focus { border-color: var(--accent); }
.input-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  margin: 12px 0 20px;
}
.btn-main {
  width: 100%;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--white);
  background: linear-gradient(90deg, #9d86e6 0%, #7fc1ea 100%);
  border: none;
  border-radius: 999px;
  padding: 16px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(120,100,210,0.3);
}
.btn-main:active { transform: scale(0.98); }
.error-msg {
  display: none;
  text-align: center;
  font-size: 12px;
  color: #d0607a;
  margin-top: 12px;
}

/* ===== 結果ページ ===== */
#result { display: none; }

.result-lead {
  text-align: center;
  font-size: 13px;
  color: var(--white);
  letter-spacing: 0.15em;
  margin-bottom: 10px;
}
.type-name {
  text-align: center;
  font-size: clamp(30px, 9vw, 40px);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--white);
  text-shadow: 0 2px 12px rgba(90,70,170,0.25);
  margin-bottom: 20px;
}
.type-img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 16px;
  margin-bottom: 20px;
}
.sec-title {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--type-color);
  letter-spacing: 0.1em;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--type-color);
  margin-bottom: 14px;
}
.sec-body {
  font-size: 15px;
  line-height: 2.1;
  color: var(--text);
}

.btn-sub {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.1em;
  color: var(--accent);
  background: var(--card);
  border: none;
  border-radius: 999px;
  padding: 14px;
  cursor: pointer;
  margin-top: 8px;
}

/* シェア */
.share-title {
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-soft);
  letter-spacing: 0.1em;
  margin-bottom: 14px;
}
.share-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.btn-share {
  display: block;
  text-align: center;
  text-decoration: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--white);
  background: #222;
  border-radius: 999px;
  padding: 13px 8px;
}
.btn-share:active { transform: scale(0.98); }

.footer {
  text-align: center;
  font-size: 11px;
  line-height: 1.9;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.05em;
  margin-top: 32px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade { animation: fadeUp 0.6s ease both; }
</style>
</head>
<body>
<div class="stars"></div>

<div class="page">

  <!-- 入力ページ -->
  <div id="input-area">
    <div class="brand">イロリズム</div>
    <h1 class="hero-title">10タイプ性格診断</h1>
    <p class="hero-catch">あなたの中に眠る、もうひとつの色。</p>
    <p class="hero-sub">生年月日から、あなたの性格・魅力・<br>恋愛傾向のヒントが見えてきます。</p>

    <div class="card">
      <span class="field-label">生年月日を選んでください</span>
      <div class="date-row">
        <select id="sel-y"><option value="">年</option></select>
        <select id="sel-m"><option value="">月</option></select>
        <select id="sel-d"><option value="">日</option></select>
      </div>
      <p class="input-hint">※ 西暦・新暦でご入力ください</p>
      <button class="btn-main" onclick="diagnose()">診断する</button>
      <p class="error-msg" id="err">生年月日を正しく選択してください</p>
    </div>
  </div>

  <!-- 結果ページ -->
  <div id="result">
    <div class="fade">
      <p class="result-lead">あなたは</p>
      <h2 class="type-name" id="r-name"></h2>
    </div>

    <div class="card fade">
      <img class="type-img" id="r-img" src="" alt="">
      <span class="sec-title">あなたの性格</span>
      <p class="sec-body" id="r-desc"></p>
    </div>

    <div class="card fade">
      <span class="sec-title">✨ あなたの魅力</span>
      <p class="sec-body" id="r-charm"></p>
    </div>
    <div class="card fade">
      <span class="sec-title">💗 恋愛のヒント</span>
      <p class="sec-body" id="r-love"></p>
    </div>
    <div class="card fade">
      <span class="sec-title">🌿 しごと・向いていること</span>
      <p class="sec-body" id="r-work"></p>
    </div>
    <div class="card fade">
      <span class="sec-title">☁️ つまずきやすいところ</span>
      <p class="sec-body" id="r-care"></p>
    </div>

    <div class="card fade">
      <p class="share-title">結果をシェアする</p>
      <div class="share-row">
        <a class="btn-share" id="share-x" href="#" target="_blank" rel="noopener">𝕏 でシェア</a>
        <a class="btn-share" id="share-threads" href="#" target="_blank" rel="noopener">Threads でシェア</a>
      </div>
    </div>

    <button class="btn-sub" onclick="reset()">もう一度診断する</button>
  </div>

  <p class="footer">© 2026 イロリズム All Rights Reserved.<br>当サイトの文章・画像・キャラクターの無断転載・複製を禁じます。</p>
</div>
