de"><p class="share-title">結果をシェアする</p><div class="share-row"><a class="btn-share" id="share-x" href="#" target="_blank" rel="noopener">𝕏 でシェア</a><a class="btn-share" id="share-threads" href="#" target="_blank" rel="noopener">Threads でシェア</a></div></div><button class="btn-sub" onclick="reset()">もう一度診断する</button></div><p class="footer">© イロリズム</p></div><script> const _lllll=[{_l11Il:'海タイプ',_llI1I:'🌊',_l1I1l:'#3a6fb0',_IlIlI:'https://i.gyazo.com/67f5c1cf9d4df0baeac3ee4714a592ac.png',_l1Ill:'あなたの強さは、海の深さに似ています。水面は穏やかで、声高に主張しない。争いも好まない。でも、誰よりも深いところに揺るがない芯を持っている。時間はあなたの味方。年齢を重ねるほどに、実力も信頼も魅力も、確かな重みを持って積み上がっていきます。',_ll1Il:'一目惚れより、時間をかけて信頼を深めていく恋。言葉は少なくても、一度決めた相手を長く大切にするタイプです。'},{_l11Il:'雨タイプ',_llI1I:'☔',_l1I1l:'#6f9fd0',_IlIlI:'https://i.gyazo.com/8d9f3ae1801b3ecf2cee9ae1a05adba6.png',_l1Ill:'柔らかく、しなやかで、どんな場所にも自然となじんでいく。雨がどんな形の器にも寄り添うように、誰とでも自然に打ち解けられる人。でもその社交性の奥には、誰にも曲げられない芯が宿っています。ひと粒は小さくても、集まるほど大きな力になる。多くの人の中でこそ、あなたの力は輝きます。',_ll1Il:'友達のような関係から、自然に恋が始まりやすい人。相手に合わせるのが上手な分、自分の気持ちも言葉にすると関係がもっと深まります。'},{_l11Il:'樹タイプ',_llI1I:'🌳',_l1I1l:'#3f8f5f',_IlIlI:'https://i.gyazo.com/181c7f06a17b1d14348abc09d80caaab.png',_l1Ill:'あなたがいるだけで、場が明るくなる。大きな樹の下に自然と人が集まるように、あなたのまわりにはいつも誰かがいる。無邪気で、おおらかで、感情のままにのびのびと動いていく。行動的で、情にもろく、気前がいい。あなたの笑顔が、周りの人にとって木陰のような安心になっています。',_ll1Il:'好きになると気持ちが表に出やすい、まっすぐな恋。一緒に笑い合える相手と、明るく育てていく恋が似合います。'},{_l11Il:'若葉タイプ',_llI1I:'🌱',_l1I1l:'#6fae5f',_IlIlI:'https://i.gyazo.com/5ece7bd2ac02a3373688d7607825f8fa.png',_l1Ill:'やわらかく穏やかな外見の奥に、まっすぐ伸びようとする強い想いがある。礼儀正しく、控えめで、思いやりがある。でも内側にはいつも熱いものが流れていて、縁のある人にはとことん親身になって尽くします。そのギャップを知る人ほど、あなたを深く信頼します。',_ll1Il:'最初は控えめでも、心を許した相手にはとことん尽くす一途さがあります。そのギャップに惹かれる人も多いはず。'},{_l11Il:'星タイプ',_llI1I:'⭐',_l1I1l:'#c08327',_IlIlI:'https://i.gyazo.com/a8c5e236164d9a9d9beeb4089cbb973f.png',_l1Ill:'あなたは、揺るがない人。夜空の星がいつも同じ場所で輝くように、急がず、焦らず、自分の位置を見失わない。面倒見がよく、愛情深く、まわりを照らす奉仕の心がある。一歩ずつ確かめながら前進するから、気づけば誰より遠くまで来ている。そんな人です。',_ll1Il:'安心感で相手を包む、頼れる存在。焦らず育てた恋の先で、気づけば相手にとってかけがえのない人になっています。'},{_l11Il:'月タイプ',_llI1I:'🌙',_l1I1l:'#c9a25a',_IlIlI:'https://i.gyazo.com/03012f2a1a179e9c3f2bf2fd559b12f2.png',_l1Ill:'あなたは、受け入れる人。月が満ち欠けを繰り返しながら輝き続けるように、良いことも、そうでないことも、すべてを自分の糧にしていく力がある。気さくで親しみやすく、誰からも好感を持たれる。でも内側はそれほど単純じゃない。芯の強さと自立心が、あなたをただのお人好しにはさせません。',_ll1Il:'相手の良いところも弱いところも受け止める包容力の持ち主。寄りかかられるだけでなく、対等でいられる相手とは長く続きます。'},{_l11Il:'炎タイプ',_llI1I:'🔥',_l1I1l:'#c94a4a',_IlIlI:'https://i.gyazo.com/0589dd6053e8ca67a9d44655cbf9da17.png',_l1Ill:'あなたは、風を受けるほど強く燃え上がる人。正直で、一本気で、行動力がある。正しいと思ったことには、損得勘定抜きでまっすぐに突き進む。その正義感と勇気が、あなたを唯一無二の存在にしています。',_ll1Il:'好きになったら自分から動く、まっすぐな恋。駆け引きより素直な気持ちが、あなたのいちばんの魅力です。'},{_l11Il:'花タイプ',_llI1I:'🌸',_l1I1l:'#d9798a',_IlIlI:'https://i.gyazo.com/0f0a5976f1cfb05685c9fd4ae18638d1.png',_l1Ill:'あなたは、手をかけるほどに美しく咲く人。生まれ持った感性の鋭さ、美しいものへの憧れ、優雅でありたいという願い——それはわがままではなく、あなたの本質が持つ正直な声。自分を大切に育てるほど、可能性はどこまでも広がっていきます。',_ll1Il:'ときめきや雰囲気を大切にする恋。自分を大切にしてくれる相手といるとき、あなたの魅力はいちばん花開きます。'},{_l11Il:'オーロラタイプ',_llI1I:'🌌',_l1I1l:'#7a55b8',_IlIlI:'https://i.gyazo.com/0d47361a6482cde5eebf8b39241717c9.png',_l1Ill:'あなたは、果てを知らない人。オーロラが夜空いっぱいに広がるように、大きくて、自由で、ひとつの形にとどまらない。大きなものも包み込む包容力と、止まることを知らない好奇心があなたの本質。幸運は、自分の実力で、自分の手でつかむもの。それがあなたらしさです。',_ll1Il:'自由を尊重し合える関係で輝くタイプ。縛られるより、一緒に新しい世界を広げていける相手に惹かれます。'},{_l11Il:'夜霧タイプ',_llI1I:'🌫️',_l1I1l:'#9a86c8',_IlIlI:'https://i.gyazo.com/76ae218cb32bc84837cf907b9800c8c9.png',_l1Ill:'あなたは、静かに浸透していく人。夜霧がいつの間にか街を包み込むように、急がず、焦らず、少しずつ広がっていく。小さな積み重ねが、やがて大きな流れになる。どんな環境にも自然と寄り添える順応性があり、その内側は慈愛にあふれている。続けることが、あなたの武器です。',_ll1Il:'ゆっくり距離を縮めていく恋。気づけば相手の心にそっと寄り添っている、深く長い愛情の持ち主です。'}];const _Il1ll='https://irorhythm.github.io/';const _Il1Il='#イロリズム #10タイプ性格診断';function _I1lIl(_IlI1I){const text='私は「'+_IlI1I._l11Il+'」でした'+_IlI1I._llI1I;const _Il11I='https://twitter.com/intent/tweet?text='+encodeURIComponent(text+'\n'+_Il1Il)+'&url='+encodeURIComponent(_Il1ll);const _lII1l='https://www.threads.net/intent/post?text='+encodeURIComponent(text+'\n'+_Il1Il+'\n'+_Il1ll);document.getElementById('share-x').href=_Il11I;document.getElementById('share-threads').href=_lII1l;}function _I1111(y,m,d){const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;retu
